name: shade_shifter
description: Premium simulator-first controller for Shade Shifter eyewear.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_blue_plus: ^1.36.8
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.2
  interactive_3d: ^2.2.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.30.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
