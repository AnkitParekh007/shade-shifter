name: Mobile app
on:
  pull_request:
    paths: ['software/mobile-app/**', 'documentation/mobile-app/**', '.github/workflows/mobile-app.yml']
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: software/mobile-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: software/mobile-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
