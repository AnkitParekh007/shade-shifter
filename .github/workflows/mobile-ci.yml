name: Mobile CI

on:
  push:
    paths:
      - "software/mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "software/mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: software/mobile-app

env:
  # 3.29+ provides Color.withValues() and CardThemeData used by the theme.
  FLUTTER_VERSION: "3.29.0"

jobs:
  analyze-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting (reports drift, non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze
      - name: Unit & widget tests
        run: flutter test --reporter expanded

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate platform shells & apply config overlays
        run: bash tool/bootstrap_platforms.sh android
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shade-shifter-debug-apk
          path: software/mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

  ios-build:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate platform shells & apply config overlays
        run: bash tool/bootstrap_platforms.sh ios
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign

  integration-test:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    needs: analyze-test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android shell
        run: bash tool/bootstrap_platforms.sh android
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: software/mobile-app
          script: flutter test integration_test
